<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>パスワード変更 | {{ app_name }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main class="narrow">
    <h1>パスワード変更</h1>
    <p class="lead">新しいパスワードは画面に再表示しません。</p>
    {% if error %}<div class="message error">{{ error }}</div>{% endif %}
    <form method="post" autocomplete="off">
      <div class="field"><label for="current_password">現在のパスワード</label><input id="current_password" name="current_password" type="password" required></div>
      <div class="field"><label for="new_password">新しいパスワード（6文字以上）</label><input id="new_password" name="new_password" type="password" required minlength="6"></div>
      <div class="field"><label for="new_password2">確認</label><input id="new_password2" name="new_password2" type="password" required minlength="6"></div>
      <button type="submit">変更する</button>
    </form>
    <p class="hint-center"><a href="{{ url_for('index') }}">戻る</a></p>
  </main>
</body>
</html>
