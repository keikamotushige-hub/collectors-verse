<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ログイン | {{ app_name }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main class="narrow">
    <p class="brand-en">{{ app_name }}</p>
    <h1>{{ app_name_ja }}</h1>
    <p class="lead">{{ app_tagline }}</p>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="message {{ 'error' if category == 'error' else 'ok' }}">{{ message }}</div>
      {% endfor %}
    {% endwith %}
    {% if error %}<div class="message error">{{ error }}</div>{% endif %}
    <form method="post" action="{{ url_for('login') }}">
      {% include "_csrf.html" %}
      <input type="hidden" name="next" value="{{ next_url or '' }}">
      <div class="field">
        <label for="email">メールアドレス</label>
        <input id="email" name="email" type="email" required value="{{ email }}" autocomplete="username">
      </div>
      <div class="field">
        <label for="password">パスワード</label>
        <input id="password" name="password" type="password" required autocomplete="current-password">
      </div>
      <button type="submit">ログイン</button>
    </form>
    <p class="hint-center">初めての方は <a href="{{ url_for('signup') }}">新規登録</a></p>
    <p class="hint-center"><a href="{{ url_for('terms') }}">利用規約・免責事項</a></p>
  </main>
</body>
</html>
